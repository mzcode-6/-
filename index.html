  }

    color: oklch(45% 0.02 55);
    margin-bottom: 22px;
  }

  .choices {
    display: flex;
    gap: 22px;
  }
  .choice {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .choice-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .choice-btn:active { transform: scale(0.96); }
  .choice-btn--correct { background: oklch(93% 0.06 150); }
  .choice-btn--correct:hover { background: oklch(89% 0.08 150); transform: scale(1.06); }
  .choice-btn--wrong { background: oklch(93% 0.06 25); }

  var state = { index: 0, screen: 'quiz' };

  function pad2(n) { return String(n).padStart(2, '0'); }
  function fmtDate(d) { return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + String(d.getFullYear()).slice(-2); }
  function fmtDateTime(d) { return pad2(d.getDate()) + '.' + pad2(d.getHours()) + '.' + pad2(d.getMinutes()); }

  // Первый рубеж — маркировка, при которой продукт спишется сегодня в конце дня.
  // Второй рубеж — сегодняшняя дата (срок > 72ч) или текущие дата и время (срок <= 72ч).
  function computeRange(item, now) {
    if (item.shelfHours == null) return null;
    var endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
    var lower = new Date(endOfToday.getTime() - item.shelfHours * 3600 * 1000);
    if (item.markingFormat === 'time') {
      return { lower: fmtDateTime(lower), upper: fmtDateTime(now) };
    }
    return { lower: fmtDate(lower), upper: fmtDate(now) };
  }

  function normalizeTemp(t) {
    if (!t) return '';
    var nums = t.match(/[+-]?\s?\d+/g);
    if (nums && nums.length === 2) {
      return 'от ' + nums[0].replace(/\s/g, '') + '°C до ' + nums[1].replace(/\s/g, '') + '°C';
    }
    if (nums && nums.length === 1) {
      var a = nums[0].replace(/\s/g, '');
      return /аннотац/i.test(t) ? a + '°C (или согласно аннотации поставщика)' : a + '°C';
    }
    return t;
  }

  function buildStorageText(item) {
    var parts = [];
    var where = normalizeTemp(item.temp);
    if (where && item.container) parts.push('Хранить при ' + where + ' в таре: ' + item.container + '.');
    else if (where) parts.push('Хранить при ' + where + '.');
    parts.push('Срок годности — ' + item.shelfText + '.');
    if (item.comment) parts.push(item.comment);
    return parts.join(' ');
  }

  function buildMarkingText(item) {
    var desc = item.markingDesc ? 'На этикетке указывают: ' + item.markingDesc + '.' : '';
    var rule = item.markingFormat === 'time'
      ? 'Срок годности до 72 часов включительно — формат маркировки дата.час.минута (пример: 08.10.47 — вскрыто 8-го числа в 10:47).'
      : 'Срок годности больше 72 часов — формат маркировки дата.месяц.год (пример: 08.07.26).';
    return (desc ? desc + ' ' : '') + rule;
  }

  function render() {
    var app = document.getElementById('app');
    var item = ITEMS[state.index];
    var key = state.screen + '-' + state.index;

    var card = document.createElement('div');
    card.className = 'card ' + (state.screen === 'quiz' ? 'card--quiz' : 'card--instruction');
    card.setAttribute('data-key', key);

    if (state.screen === 'quiz') {
      var range = computeRange(item, new Date());
      var chipValue = range ? (range.lower + ' – ' + range.upper) : item.shelfText;
      var chipLabel = range
        ? (item.markingFormat === 'time' ? 'верный диапазон маркировки (дата.час.минута)' : 'верный диапазон маркировки (дата.месяц.год)')
        : 'срок годности — по данным поставщика';

      card.innerHTML =
        '<div class="eyebrow">Маркировка</div>' +
        '<div class="category-tag"></div>' +
        '<h1 class="item-name"></h1>' +
        '<div class="shelf-life">' +
          '<div class="value"></div>' +
          '<div class="label"></div>' +
        '</div>' +
        '<div class="prompt">Промаркировали верно?</div>' +
        '<div class="choices">' +
          '<div class="choice">' +
            '<button class="choice-btn choice-btn--correct" aria-label="Верно">' +
              '<svg width="26" height="26" viewBox="0 0 24 24" fill="none">' +
                '<path d="M4 12.5L9.5 18L20 6" stroke="oklch(48% 0.14 150)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>' +
              '</svg>' +
            '</button>' +
            '<div class="choice-label">Верно</div>' +
          '</div>' +
          '<div class="choice">' +
            '<button class="choice-btn choice-btn--wrong" aria-label="Не уверен(а)">' +
              '<svg width="24" height="24" viewBox="0 0 24 24" fill="none">' +
                '<path d="M6 6L18 18M18 6L6 18" stroke="oklch(50% 0.19 25)" stroke-width="3" stroke-linecap="round"></path>' +
              '</svg>' +
            '</button>' +
            '<div class="choice-label">Не уверен(а)</div>' +
          '</div>' +
          '<div class="choice">' +
            '<button class="choice-btn choice-btn--absent" aria-label="Отсутствует">' +
              '<svg width="24" height="24" viewBox="0 0 24 24" fill="none">' +
                '<path d="M5 12H19" stroke="oklch(45% 0.01 55)" stroke-width="3" stroke-linecap="round"></path>' +
              '</svg>' +
            '</button>' +
            '<div class="choice-label">Отсутствует</div>' +
          '</div>' +
        '</div>';

      card.querySelector('.category-tag').textContent = item.category;
      var nameEl = card.querySelector('.item-name');
      nameEl.textContent = item.name;
      if (item.name.length > 40) nameEl.classList.add('item-name--long');
      card.querySelector('.value').textContent = chipValue;
      card.querySelector('.label').textContent = chipLabel;

      function next() {
        state = { index: (state.index + 1) % ITEMS.length, screen: 'quiz' };
        render();
      }
      card.querySelector('.choice-btn--correct').addEventListener('click', next);
      card.querySelector('.choice-btn--absent').addEventListener('click', next);
      card.querySelector('.choice-btn--wrong').addEventListener('click', function () {
        state = { index: state.index, screen: 'instruction' };
        render();
      });
    } else {
      card.innerHTML =
        '<div class="eyebrow">Подсказка</div>' +
        '<h2 class="instruction-title"></h2>' +
        '<p class="instruction-text storage-text"></p>' +
        '<p class="instruction-text marking-text"></p>' +
        '<p class="instruction-text recipe-text" hidden></p>' +
        '<button class="primary-btn">Всё понятно</button>';

      card.querySelector('.instruction-title').textContent = item.name;
      card.querySelector('.storage-text').textContent = buildStorageText(item);
      card.querySelector('.marking-text').textContent = buildMarkingText(item);
      if (item.recipe) {
        var recipeEl = card.querySelector('.recipe-text');
        recipeEl.hidden = false;
        recipeEl.innerHTML = '<b>Как готовить: </b>' + item.recipe;
      }

      card.querySelector('.primary-btn').addEventListener('click', function () {
        state = { index: (state.index + 1) % ITEMS.length, screen: 'quiz' };
        render();
      });
    }

    app.replaceChildren(card);
  }

  render();
</script>
