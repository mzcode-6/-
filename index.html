  function pad2(n) { return String(n).padStart(2, '0'); }
  function fmtDate(d) { return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + String(d.getFullYear()).slice(-2); }
  function fmtDateTime(d) { return pad2(d.getDate()) + '.' + pad2(d.getHours()) + '.' + pad2(d.getMinutes()); }

  // Позиции, которые используются исключительно при приготовлении конкретного
  // напитка (остаток от его приготовления) — маркируются только в часы работы
  // кофейни, 10:00-22:00. Всё остальное — заготовки/перетаривание — можно
  // маркировать и в другое время, если срок хранения <= 72ч.
  var DRINK_ONLY_ROWS = [9, 10, 11, 14, 15, 16, 41];

  // Первый рубеж — маркировка, при которой продукт спишется сегодня в конце дня
  // (только дата подбирается по сроку хранения; время фиксировано правилом ниже).
  // Второй рубеж — сегодняшняя дата (срок > 72ч) или фиксированные 10:30 (срок <= 72ч):
  // кофейня открывается в 10:00, поэтому второй рубеж больше не привязан к
  // текущему времени устройства.
  //
  // Срок <= 72ч (формат дата.час.минута): маркировка должна быть такой, чтобы
  // позиция не считалась просроченной как минимум сегодня в 19:00 — это и
  // "конец дня" в контексте тренажёра, с запасом до закрытия. Отсюда два условия
  // для нижней границы:
  //  - она не может быть раньше открытия (10:00 — под конкретный напиток,
  //    8:00 — заготовка/перетаривание);
  //  - она не может быть позже (19:00 − срок хранения), иначе позиция спишется
  //    раньше 19:00.
  // Берём более позднее (более строгое) из этих двух значений — сегодняшним
  // числом. Верхняя граница — фиксированные 10:30, но не раньше нижней.
  function computeRange(item, now) {
    if (item.shelfHours == null) return null;

    if (item.markingFormat === 'date') {
      var endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
      var lowerRaw = new Date(endOfToday.getTime() - item.shelfHours * 3600 * 1000);
      return { lower: fmtDate(lowerRaw), upper: fmtDate(now) };
    }

    var isDrinkOnly = DRINK_ONLY_ROWS.indexOf(item.row) !== -1;
    var openingHour = isDrinkOnly ? 10 : 8;
    var opening = new Date(now.getFullYear(), now.getMonth(), now.getDate(), openingHour, 0, 0, 0);
    var cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 19, 0, 0, 0);
    var latestSafe = new Date(cutoff.getTime() - item.shelfHours * 3600 * 1000);
    var lower = latestSafe.getTime() > opening.getTime() ? latestSafe : opening;

    var fixedUpper = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 10, 30, 0, 0);
    var upper = fixedUpper.getTime() > lower.getTime() ? fixedUpper : lower;

    return { lower: fmtDateTime(lower), upper: fmtDateTime(upper) };
  }

  function normalizeTemp(t) {
    if (!t) return '';
    var nums = t.match(/[+-]?\s?\d+/g);
    if (nums && nums.length === 2) {
      return 'от ' + nums[0].replace(/\s/g, '') + '°C до ' + nums[1].replace(/\s/g, '') + '°C';

    if (nums && nums.length === 1) {
      var a = nums[0].replace(/\s/g, '');
      return /аннотац/i.test(t) ? a + '°C (или согласно аннотации поставщика)' : a + '°C';
    }
    return t;
  }

  }

  function render() {
    var app = document.getElementById('app');
    var item = state.screen !== 'done' ? ITEMS[state.index] : null;
    var key = state.screen + '-' + state.index;

    var shownIndex = state.screen === 'done' ? ITEMS.length : state.index + 1;
    document.getElementById('progressBadge').textContent = shownIndex + ' / ' + ITEMS.length;

    var card = document.createElement('div');
    card.className = 'card ' + (state.screen === 'instruction' ? 'card--instruction' : 'card--quiz');
    card.setAttribute('data-key', key);

    if (state.screen === 'done') {
      card.innerHTML =
        '<div class="done-icon">' +
          '<svg width="34" height="34" viewBox="0 0 24 24" fill="none">' +
            '<path d="M4 12.5L9.5 18L20 6" stroke="oklch(98% 0.01 150)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>' +
          '</svg>' +
        '</div>' +
        '<h1 class="done-title">Бар полностью промаркирован!</h1>' +
        '<p class="done-text">Отлично. Теперь попроси проверить менеджера, на всякий случай.</p>' +
        '<button class="primary-btn">Проверить снова</button>';

      card.querySelector('.primary-btn').addEventListener('click', function () {
        navHistory = [];
        state = { index: 0, screen: 'quiz' };
        render();
      });

      app.replaceChildren(card);
      document.getElementById('backBtn').disabled = navHistory.length === 0;
      return;
    }

    if (state.screen === 'quiz') {
      var range = computeRange(item, new Date());
      var chipValue = range ? (range.lower + ' – ' + range.upper) : item.shelfText;
      var chipLabel = range
        ? (item.markingFormat === 'time' ? 'верный диапазон маркировки (дата.час.минута)' : 'верный диапазон маркировки (дата.месяц.год)')
        : 'срок годности — по данным поставщика';

      card.innerHTML =
        '<div class="eyebrow">Маркировка</div>' +
        '<div class="category-tag"></div>' +
        '<h1 class="item-name"></h1>' +
        '<div class="shelf-life">' +
          '<div class="value"></div>' +
          '<div class="label"></div>' +
        '</div>' +
        '<div class="prompt">Промаркировали верно?</div>' +
        '<div class="choices">' +
          '<div class="choice">' +
            '<button class="choice-btn choice-btn--correct" aria-label="Верно">' +
              '<svg width="26" height="26" viewBox="0 0 24 24" fill="none">' +
                '<path d="M4 12.5L9.5 18L20 6" stroke="oklch(48% 0.14 150)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>' +
              '</svg>' +
            '</button>' +
            '<div class="choice-label">Верно</div>' +
          '</div>' +
          '<div class="choice">' +
            '<button class="choice-btn choice-btn--absent" aria-label="Отсутствует">' +
              '<svg width="24" height="24" viewBox="0 0 24 24" fill="none">' +
                '<path d="M5 12H19" stroke="oklch(45% 0.01 55)" stroke-width="3" stroke-linecap="round"></path>' +
              '</svg>' +
            '</button>' +
            '<div class="choice-label">Отсутствует</div>' +
          '</div>' +
          '<div class="choice">' +
            '<button class="choice-btn choice-btn--wrong" aria-label="Не уверен(а)">' +
              '<svg width="24" height="24" viewBox="0 0 24 24" fill="none">' +
                '<path d="M6 6L18 18M18 6L6 18" stroke="oklch(50% 0.19 25)" stroke-width="3" stroke-linecap="round"></path>' +
              '</svg>' +
            '</button>' +
            '<div class="choice-label">Не уверен(а)</div>' +
          '</div>' +
        '</div>';

      card.querySelector('.category-tag').textContent = item.category;
      var nameEl = card.querySelector('.item-name');
      nameEl.textContent = item.name;
      if (item.name.length > 40) nameEl.classList.add('item-name--long');
      card.querySelector('.value').textContent = chipValue;
      card.querySelector('.label').textContent = chipLabel;

      function next() {
        if (state.index === ITEMS.length - 1) {
          goForward({ index: state.index, screen: 'done' });
        } else {
          goForward({ index: state.index + 1, screen: 'quiz' });
        }
      }
      card.querySelector('.choice-btn--correct').addEventListener('click', next);
      card.querySelector('.choice-btn--absent').addEventListener('click', next);
      card.querySelector('.choice-btn--wrong').addEventListener('click', function () {
        // Подсказка — не отдельная "страница": не попадает в историю переходов,
        // назад с неё или после её закрытия ведёт к прошлому товару, а не к ней самой.
        state = { index: state.index, screen: 'instruction' };
        render();
      });
    } else {
      card.innerHTML =
        '<div class="eyebrow">Подсказка</div>' +
        '<h2 class="instruction-title"></h2>' +
        '<p class="instruction-text storage-text"></p>' +
        '<p class="instruction-text marking-text"></p>' +
        '<p class="instruction-text recipe-text" hidden></p>' +
        '<button class="primary-btn">Всё понятно</button>';

      card.querySelector('.instruction-title').textContent = item.name;
      card.querySelector('.storage-text').textContent = buildStorageText(item);
      card.querySelector('.marking-text').textContent = buildMarkingText(item);
      if (item.recipe) {
        var recipeEl = card.querySelector('.recipe-text');
        recipeEl.hidden = false;
        recipeEl.innerHTML = '<b>Как готовить: </b>' + item.recipe;
      }

      card.querySelector('.primary-btn').addEventListener('click', function () {
        state = { index: state.index, screen: 'quiz' };
        render();
      });
    }

    app.replaceChildren(card);
    document.getElementById('backBtn').disabled = navHistory.length === 0;
  }

  document.getElementById('backBtn').addEventListener('click', goBack);

  // Сообщения об ошибках: копим в localStorage (на случай, если письмо не
  // уйдёт — почтового клиента может не быть на устройстве) и одновременно
  // открываем письмо с адресом страницы и текстом сообщения.
  var REPORTS_KEY = 'markirovka_reports';
  var REPORT_EMAIL = 'mzhome6tv@gmail.com';

  function currentPageLabel() {
    if (state.screen === 'done') return 'Финальный экран';
    var item = ITEMS[state.index];
    var screenLabel = state.screen === 'instruction' ? 'подсказка' : 'карточка';
    return (state.index + 1) + '/' + ITEMS.length + ' — ' + item.name + ' (' + screenLabel + ')';
  }

  function saveReport(pageLabel, message) {
    var reports = [];
    try { reports = JSON.parse(localStorage.getItem(REPORTS_KEY)) || []; } catch (e) {}
    reports.push({ page: pageLabel, message: message, when: new Date().toISOString() });
    try { localStorage.setItem(REPORTS_KEY, JSON.stringify(reports)); } catch (e) {}
  }

  var reportOverlay = document.getElementById('reportOverlay');
  var reportText = document.getElementById('reportText');
  var reportPageLabel = document.getElementById('reportPageLabel');

  function openReportDialog() {
    reportPageLabel.textContent = 'Страница: ' + currentPageLabel();
    reportText.value = '';
    reportOverlay.hidden = false;
    reportText.focus();
  }
  function closeReportDialog() {
    reportOverlay.hidden = true;
  }

  document.getElementById('reportBtn').addEventListener('click', openReportDialog);
  document.getElementById('reportCancel').addEventListener('click', closeReportDialog);
  reportOverlay.addEventListener('click', function (e) {
    if (e.target === reportOverlay) closeReportDialog();
  });
  document.getElementById('reportSend').addEventListener('click', function () {
    var message = reportText.value.trim();
    if (!message) return;
    var pageLabel = currentPageLabel();
    saveReport(pageLabel, message);
    var subject = 'Ошибка на сайте — ' + pageLabel;
    var body = 'Страница: ' + pageLabel + '\n\n' + message;
    var mailto = 'mailto:' + REPORT_EMAIL + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    window.location.href = mailto;
    closeReportDialog();
  });

  render();
</script>
</body>
</html>
